<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مكتبة الفتح بالعطف | منصة التحفيز وتنشيط الذهن</title>
    <!-- تحميل خط Cairo العصري من Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- تحميل Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                    },
                    colors: {
                        burgundy: {
                            950: '#2b040e',
                            900: '#450819',
                            800: '#590d22',
                            700: '#7a1230',
                            600: '#9c193f',
                        },
                        gold: {
                            300: '#f5d97e',
                            400: '#e6c24c',
                            500: '#d4af37',
                            600: '#b39022',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        * {
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #160308;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(122, 18, 48, 0.38) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(212, 175, 55, 0.14) 0%, transparent 45%);
            color: #ffffff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .hidden {
            display: none !important;
        }

        /* تأثيرات التوهج والزجاج */
        .glass-card {
            background: rgba(69, 8, 25, 0.72);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(212, 175, 55, 0.25);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.65);
        }

        .burgundy-glow {
            box-shadow: 0 0 25px rgba(122, 18, 48, 0.65), inset 0 0 15px rgba(212, 175, 55, 0.12);
        }

        .touch-glow:active {
            box-shadow: 0 0 22px rgba(212, 175, 55, 0.65);
        }

        /* توهج نابض أثناء قراءة الجملة صوتياً */
        @keyframes speakingPulse {
            0%, 100% {
                box-shadow: 0 0 20px rgba(212, 175, 55, 0.45), 0 0 40px rgba(122, 18, 48, 0.85);
                border-color: rgba(212, 175, 55, 0.9);
            }
            50% {
                box-shadow: 0 0 38px rgba(212, 175, 55, 0.9), 0 0 65px rgba(212, 175, 55, 0.45);
                border-color: #ffffff;
            }
        }

        .speaking-active {
            animation: speakingPulse 1.4s infinite ease-in-out;
        }

        /* حركة تغيير الجملة */
        @keyframes fadeSlideUp {
            0% { opacity: 0; transform: translateY(12px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .quote-animate {
            animation: fadeSlideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* كروت لعبة الذاكرة 3D */
        .memory-card {
            perspective: 1000px;
            aspect-ratio: 1 / 1;
        }

        .memory-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .memory-card.flipped .memory-inner,
        .memory-card.matched .memory-inner {
            transform: rotateY(180deg);
        }

        .memory-front, .memory-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .memory-front {
            background: linear-gradient(135deg, #7a1230 0%, #450819 100%);
            border: 1.5px solid rgba(212, 175, 55, 0.38);
        }

        .memory-back {
            background: linear-gradient(135deg, #e6c24c 0%, #b39022 100%);
            color: #2b040e;
            transform: rotateY(180deg);
            border: 2px solid #ffffff;
        }

        .memory-card.matched .memory-back {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.5);
        }

        /* أزرار لعبة سيمون للألوان */
        .simon-pad {
            transition: all 0.15s ease;
            opacity: 0.72;
        }
        .simon-pad.active-lit {
            opacity: 1;
            transform: scale(1.04);
            filter: brightness(1.45);
            box-shadow: 0 0 30px currentColor;
        }

        /* شريط التمرير المخصص */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #160308;
        }
        ::-webkit-scrollbar-thumb {
            background: #7a1230;
            border-radius: 10px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-gold-500 selection:text-burgundy-950">

    <!-- رسالة تنبيه عائمة (Toast Notification) -->
    <div id="toast-container" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 w-[90%] max-w-sm pointer-events-none transition-all duration-300 opacity-0 -translate-y-4">

        </div>
    </div>

    <!-- شاشة الترحيب والتسجيل (Welcome & OTP Modal) -->

                        </button>
                    </div>
                </div>

                <div>

                <button type="button" onclick="sendOTPCode()" class="w-full py-3 mt-1 rounded-xl bg-gradient-to-r from-gold-500 to-gold-400 hover:from-gold-400 hover:to-gold-300 text-burgundy-950 font-black text-sm sm:text-base shadow-lg shadow-gold-500/25 active:scale-95 transition flex items-center justify-center gap-2 touch-glow">

                <button type="button" onclick="enterAppAsGuest()" class="w-full py-1.5 text-xs text-gray-400 hover:text-gold-400 font-semibold transition">

                        <input type="text" maxlength="1" inputmode="numeric" class="otp-digit w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl font-black rounded-2xl bg-black/60 border-2 border-gold-500/45 text-gold-400 focus:border-gold-400 focus:outline-none transition">
                        <input type="text" maxlength="1" inputmode="numeric" class="otp-digit w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl font-black rounded
